name: Déploiement VPS

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  VPS_HOST: srv1790747.hstgr.cloud
  VPS_USER: root
  VPS_PATH: /home/president/apps/diarra

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ajouter le VPS aux hôtes connus
        run: ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # Rend le VPS identique au code qui vient d'être poussé sur master,
      # SANS toucher aux fichiers propres au VPS (.env, secrets, données).
      - name: Synchroniser le code vers le VPS
        run: |
          rsync -rlt --delete --no-owner --no-group \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='out/' \
            --exclude='.wrangler/' \
            ./ "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      # DIARRA tourne sur k3s depuis cette session (voir README section
      # "Déploiement Kubernetes") — l'ancienne stack Docker Compose a été
      # entièrement supprimée (conteneurs + volumes). k8s/deploy.sh build
      # les images, les importe dans containerd et réapplique les
      # manifests ; le rollout Kubernetes ne coupe jamais le trafic
      # (anciens pods servent jusqu'à ce que les nouveaux soient prêts).
      - name: Build & déploiement k3s
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -euo pipefail <<EOF
            cd "$VPS_PATH"

            if [ ! -f .env ]; then
              echo "ERREUR : $VPS_PATH/.env introuvable sur le VPS." >&2
              echo "À créer manuellement une seule fois (voir README section 7) avant le premier déploiement." >&2
              exit 1
            fi

            sh k8s/deploy.sh
            docker image prune -f
          EOF

      - name: Vérification de santé
        run: |
          sleep 5
          curl -sf https://diarra.abmcy.com/api/products > /dev/null \
            && echo "OK : le backend répond" \
            || (echo "ÉCHEC du health check après déploiement" && exit 1)

      # Déploie le frontend statique sur Cloudflare (voir worker/) — n'agit
      # que si le secret est configuré, pour ne jamais casser le déploiement
      # VPS existant tant que la migration Cloudflare n'est pas activée.
      - name: Build du frontend pour Cloudflare
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://diarra.abmcy.com
          NEXT_PUBLIC_WS_URL: wss://diarra.abmcy.com
          NEXT_PUBLIC_SITE_URL: https://diarra.abmcy.com
        run: |
          npm ci
          npm run build

      - name: Déploiement Cloudflare Worker (frontend)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: ./worker
        run: |
          npm ci
          npx wrangler deploy
