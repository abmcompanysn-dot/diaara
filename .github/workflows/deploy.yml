name: Déploiement VPS

on:
  push:
    branches: [master]
    # Le VPS ne sert plus le frontend une fois Cloudflare en place — pas
    # besoin de rebuild ses images Docker pour des changements qui ne
    # touchent que le frontend/worker (Cloudflare a son propre build,
    # indépendant). Réduit aussi le nombre de builds Docker déclenchés sur
    # le VPS, qui a montré des signes de fragilité sous charge répétée.
    paths:
      - 'backend/**'
      - 'k8s/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  VPS_HOST: srv1790747.hstgr.cloud
  VPS_USER: root
  VPS_PATH: /home/president/apps/diarra

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # nécessaire pour comparer HEAD^ vs HEAD juste après

      # Le VPS a montré des blocages répétés (paquets apk sous charge) sur
      # `docker build backend` — le rebuilder pour un déploiement qui ne
      # touche QUE k8s/ (ex. un Ingress) n'a aucune utilité (aucun nouveau
      # code) et ne fait que multiplier les occasions de tomber sur ce
      # blocage. On ne le construit donc que si backend/ a réellement changé.
      - name: Détecter si le backend a changé
        id: backend_changed
        run: |
          if git diff --quiet HEAD^ HEAD -- backend/ 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurer la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ajouter le VPS aux hôtes connus
        run: ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # Rend le VPS identique au code qui vient d'être poussé sur master,
      # SANS toucher aux fichiers propres au VPS (.env, secrets, données).
      - name: Synchroniser le code vers le VPS
        run: |
          rsync -rlt --delete --no-owner --no-group \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='out/' \
            --exclude='.wrangler/' \
            ./ "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      # DIARRA tourne sur k3s depuis cette session (voir README section
      # "Déploiement Kubernetes") — l'ancienne stack Docker Compose a été
      # entièrement supprimée (conteneurs + volumes). k8s/deploy.sh build
      # les images, les importe dans containerd et réapplique les
      # manifests ; le rollout Kubernetes ne coupe jamais le trafic
      # (anciens pods servent jusqu'à ce que les nouveaux soient prêts).
      - name: Build & déploiement k3s
        env:
          BACKEND_CHANGED: ${{ steps.backend_changed.outputs.changed }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -euo pipefail <<EOF
            cd "$VPS_PATH"

            if [ ! -f .env ]; then
              echo "ERREUR : $VPS_PATH/.env introuvable sur le VPS." >&2
              echo "À créer manuellement une seule fois (voir README section 7) avant le premier déploiement." >&2
              exit 1
            fi

            BACKEND_CHANGED="$BACKEND_CHANGED" sh k8s/deploy.sh
            docker image prune -f
          EOF

      - name: Vérification de santé
        run: |
          sleep 5
          curl -sf https://diarra.abmcy.com/api/products > /dev/null \
            && echo "OK : le backend répond" \
            || (echo "ÉCHEC du health check après déploiement" && exit 1)

      # Le frontend est déployé par le build Git natif de Cloudflare
      # (Workers Builds, connecté directement au dépôt) — pas par ce
      # workflow. Les anciennes étapes qui dupliquaient ce déploiement ici
      # (build + wrangler deploy) ont été retirées.
