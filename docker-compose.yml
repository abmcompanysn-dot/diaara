services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diarra
      POSTGRES_USER: diarra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diarra_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diarra -d diarra"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    extra_hosts:
      # Le VPS resout son propre hostname vers 127.0.1.1 (config cloud-init),
      # ce qui casse la connexion SMTP sortante vers le serveur mail depuis
      # ce conteneur. On force la vraie IP publique.
      - "srv1790747.hstgr.cloud:187.77.178.170"
    environment:
      DATABASE_URL: postgres://diarra:${POSTGRES_PASSWORD:-diarra_dev}@postgres:5432/diarra?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      REFRESH_SECRET: ${REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAILTRAP_API_KEY: ${MAILTRAP_API_KEY:-}
      MAILTRAP_FROM: ${MAILTRAP_FROM:-}
      MAILTRAP_SANDBOX_ID: ${MAILTRAP_SANDBOX_ID:-}
      PAWAPAY_API_KEY: ${PAWAPAY_API_KEY:-}
      PAWAPAY_BASE_URL: ${PAWAPAY_BASE_URL:-https://api.sandbox.pawapay.io}
      PAWAPAY_CALLBACK_URL: ${PAWAPAY_CALLBACK_URL:-}
      PAWAPAY_CALLBACK_IPS: ${PAWAPAY_CALLBACK_IPS:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_TIKTOK_URL: ${NEXT_PUBLIC_TIKTOK_URL:-}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      - backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-diarra_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-diarra_minio_dev}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
