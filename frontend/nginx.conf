# ---------- En-têtes de sécurité ----------
# nginx n'hérite PAS ces en-têtes dans une location qui définit son propre
# add_header (règle nginx : un add_header local remplace, ne complète pas,
# ceux du parent) — donc répétés explicitement dans chaque location de
# page/asset ci-dessous plutôt que posés une seule fois. Absents avant cet
# audit : aucune CSP/X-Frame-Options ne protégeait l'app elle-même (seules
# les réponses API du backend en avaient) — voir audit sécurité 2026-09-11,
# notamment en défense en profondeur contre un XSS stocké (finding #1,
# corrigé côté backend+frontend séparément) : même si un script inline
# s'exécutait, connect-src ci-dessous empêche l'exfiltration de
# localStorage.access_token vers un domaine hors liste blanche.
#
# 'unsafe-inline' reste nécessaire pour script-src (Facebook Pixel/Google Tag
# injectés en <script> inline, voir VendorAdPixels — leur contenu est
# désormais un template fixe, l'ID vendeur passe par un data-attribute, donc
# plus interpolé dans le JS) — resserrer davantage (nonce/hash) demanderait
# un rendu par requête, impossible en export statique.
#
# Valeur définie au niveau http (map ne peut pas être dans un bloc server),
# réutilisée dans location / ci-dessous.
map $host $csp_header {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://www.googletagmanager.com https://apis.google.com https://www.gstatic.com https://www.google.com; connect-src 'self' https://api.pawapay.io https://api.sandbox.pawapay.io https://www.google-analytics.com https://connect.facebook.net https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- Cache navigateur ----------
    # Fichiers _next/static : nommés par hash → immuables, cache long
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Images / polices publiques : cache court
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # API → reverse proxy vers le backend (origine unique, évite CORS)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket temps réel (ordres, modération)
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Pages HTML (export statique) : revalidation systématique
    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp_header always;
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }
}
