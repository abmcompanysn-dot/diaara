# Reproduit les règles du Caddyfile du VPS : /api, /ws, /p, /r, /feed,
# /sitemap.xml vers le backend. Le frontend n'est plus servi par le VPS
# (déplacé sur Cloudflare Worker "diaara", voir worker/) : ce host ne sert que
# l'API. Le Worker (diarra.app) proxifie /api/* etc. vers `api.diarra.app`
# (BACKEND_URL dans worker/wrangler.jsonc) ; les webhooks PawaPay/PayPal
# appellent aussi `api.diarra.app` en direct. `origin.abmcy.com` a été
# abandonné (fetch Worker en 526 : validation stricte du certificat d'origine).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diarra
  namespace: diarra
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m" # upload produit jusqu'à 50 Mo, voir ProductHandler.Upload
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # WebSocket temps réel (commandes, modération)
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Caddy (devant, TLS auto) parle à ce NodePort en clair (127.0.0.1:30080,
    # trafic local à la VM) — sans ceci, ingress-nginx régénère
    # X-Forwarded-Proto à partir de SA PROPRE connexion (http), donc le
    # backend croit être servi en HTTP et construit des URLs d'image
    # http:// dans sitemap.xml/flux Google Merchant (voir requestOrigin,
    # feed_handler.go) au lieu de https://. configuration-snippet est
    # désactivé sur ce contrôleur (durcissement sécurité) — proxy-set-headers
    # (référence un ConfigMap dédié, voir headers-configmap.yaml) reste
    # disponible et n'a pas cette restriction.
    nginx.ingress.kubernetes.io/proxy-set-headers: "diarra/backend-proxy-headers"
spec:
  ingressClassName: nginx
  rules:
    - host: api.diarra.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /p
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /r
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /feed
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /sitemap.xml
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Racine "/" : webhooks des prestataires (/api/webhooks/* est déjà
          # couvert par /api, mais on garde "/" pour /health et les curl de
          # vérif directs). Le frontend est servi par le Worker, pas ici.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
