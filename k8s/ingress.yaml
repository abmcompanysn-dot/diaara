# Reproduit les règles du Caddyfile du VPS : /api, /ws, /p, /r, /feed,
# /sitemap.xml vers le backend. Le frontend n'est plus servi par le VPS
# (déplacé sur Cloudflare Worker, voir worker/) — diarra.abmcy.com ne sert
# donc plus que l'API ; la racine "/" devient à terme une redirection vers
# diarra.app (gérée côté utilisateur, hors de ce fichier).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diarra
  namespace: diarra
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m" # upload produit jusqu'à 50 Mo, voir ProductHandler.Upload
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # WebSocket temps réel (commandes, modération)
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Caddy (devant, TLS auto) parle à ce NodePort en clair (127.0.0.1:30080,
    # trafic local à la VM) — sans ceci, ingress-nginx régénère
    # X-Forwarded-Proto à partir de SA PROPRE connexion (http), donc le
    # backend croit être servi en HTTP et construit des URLs d'image
    # http:// dans sitemap.xml/flux Google Merchant (voir requestOrigin,
    # feed_handler.go) au lieu de https://.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Proto "https";
spec:
  ingressClassName: nginx
  rules:
    - host: diarra.abmcy.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /p
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /r
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /feed
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /sitemap.xml
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
    # Adresse dédiée au backend seul — diarra.abmcy.com devient à terme une
    # redirection vers diarra.app (frontend, servi par Cloudflare Worker),
    # qui proxy /api/* etc. vers ce host pour joindre le backend.
    - host: origin.abmcy.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
