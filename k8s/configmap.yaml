apiVersion: v1
kind: ConfigMap
metadata:
  name: diarra-config
  namespace: diarra
data:
  APP_ENV: "production"
  PORT: "8080"
  # URL publique du site — base des liens générés côté backend (sitemap, flux,
  # partage, returnUrl PawaPay/PayPal post-paiement, voir sale_handler.go). Le
  # frontend est servi par le Worker Cloudflare "diaara" sur diarra.app ; le
  # backend est joint sur api.diarra.app (ingress ci-contre + Caddy).
  FRONTEND_URL: "https://diarra.app"
  CORS_ALLOWED_ORIGINS: "https://diarra.app"
  # Défaut sandbox si absent du Secret — mettre l'URL live via le Secret en prod.
  PAYPAL_BASE_URL: "https://api-m.paypal.com"
  REDIS_URL: "redis://redis:6379"
  # Endpoint S3 PUBLIC (proxifié par Caddy), pas l'adresse interne du
  # cluster : les URLs signées générées par le backend doivent être
  # résolvables directement par le navigateur du client (voir
  # backend/internal/handler/product_handler.go, Cover/Preview/Delivery).
  S3_ENDPOINT: "https://files.diarra.app"
  S3_BUCKET: "diarra-files"
  S3_REGION: "us-east-1"
  # Production, pas sandbox — la clé API configurée (PAWAPAY_API_KEY, dans
  # le Secret) est une clé de production. Cette valeur était figée en dur
  # ici sur l'ancienne URL sandbox lors de la migration k8s, alors que le
  # .env du VPS avait déjà la bonne (docker-compose la lisait depuis .env,
  # ce ConfigMap ne le faisait pas) — la clé prod se faisait rejeter par
  # l'API sandbox, d'où les 401/502 sur /api/orders.
  PAWAPAY_BASE_URL: "https://api.pawapay.io"
  KPAY_BASE_URL: "https://admin.kpay.site"
  SMTP_PORT: "587"
