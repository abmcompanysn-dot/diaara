# Pur cache (catalogue, stats admin, solde vendeur, rate limiting) — comme
# dans docker-compose.yml, pas de volume persistant nécessaire, donc
# Deployment plutôt que StatefulSet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: diarra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", ""]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: diarra
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
