apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: diarra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Le VPS résout son propre hostname vers 127.0.1.1 (config cloud-init),
      # ce qui casse la connexion SMTP sortante vers le serveur mail depuis
      # ce pod — même contournement que docker-compose.yml (extra_hosts),
      # jamais porté ici lors de la migration k8s (cause des emails qui ne
      # partent pas).
      hostAliases:
        - ip: "187.77.178.170"
          hostnames:
            - "srv1790747.hstgr.cloud"
      # Laisse le temps à l'ingress-nginx de retirer ce pod de son pool de
      # destinations avant que le conteneur ne reçoive SIGTERM et referme ses
      # connexions — sans ça, un scale-down du HPA (ou un rollout) peut tuer
      # un pod qui vient tout juste de recevoir une requête déjà routée vers
      # lui, provoquant un 502 sporadique côté client (observé 2026-09-07 sur
      # /api/admin/payouts/{id}/retry pendant un scale-down 3→2). Doit rester
      # cohérent avec le shutdownCtx de 30s dans main.go (préStop + délai de
      # grâce du pod doivent tenir dans cette fenêtre).
      terminationGracePeriodSeconds: 40
      containers:
        - name: backend
          # Construite localement puis importée dans containerd via
          # `k3s ctr images import` (voir k8s/deploy.sh) — pas de registre.
          image: diarra-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: diarra-config
            - secretRef:
                name: diarra-secrets
          lifecycle:
            preStop:
              exec:
                # sleep, pas de dépendance à un shell exotique dans l'image
                # (voir Dockerfile) — juste attendre que kube-proxy/ingress
                # propagent le retrait de l'endpoint avant SIGTERM.
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: diarra
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: diarra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
