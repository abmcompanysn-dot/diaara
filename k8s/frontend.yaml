apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: diarra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # SSR (Next.js standalone) depuis la migration k8s — plus un
          # export statique, voir generateMetadata dans
          # frontend/src/app/product/page.tsx pour l'Open Graph par produit.
          image: diarra-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: INTERNAL_API_URL
              valueFrom:
                configMapKeyRef:
                  name: diarra-config
                  key: INTERNAL_API_URL
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: diarra
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
