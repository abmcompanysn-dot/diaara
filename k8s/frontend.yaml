apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: diarra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Export statique servi par nginx (voir frontend/Dockerfile +
          # frontend/nginx.conf) — l'Open Graph par produit passe par la
          # route backend /p/{id} (ProductHandler.Share), pas par du SSR.
          image: diarra-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: diarra
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
